    var button = document.createElement('button');
    button.className = 'code-copy-btn';
    button.type = 'button';
    button.title = '复制代码';
    button.setAttribute('aria-label', '复制代码');
    button.innerHTML = '<span class="fa fa-copy" aria-hidden="true"></span>';
    block.appendChild(button);

    function setState(state) {
      var succeeded = state === 'copied';
      button.classList.toggle('copied', succeeded);
      button.setAttribute('aria-label', succeeded ? '已复制' : state === 'failed' ? '复制失败' : '复制代码');
      button.setAttribute('title', succeeded ? '已复制' : state === 'failed' ? '复制失败' : '复制代码');
      button.innerHTML = '<span class="fa fa-' + (succeeded ? 'check' : state === 'failed' ? 'times' : 'copy') + '" aria-hidden="true"></span>';
    }

    function fallbackCopy(text) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      var copied = document.execCommand('copy');
      document.body.removeChild(textarea);
      return copied;
    }

    button.addEventListener('click', function() {
      var text = codeNode.textContent;
      var operation = navigator.clipboard
        ? navigator.clipboard.writeText(text).then(function() { return true; })
        : Promise.resolve(fallbackCopy(text));

      operation.then(function(copied) {
        setState(copied ? 'copied' : 'failed');
      }).catch(function() {
        setState(fallbackCopy(text) ? 'copied' : 'failed');
      }).finally(function() {
        setTimeout(function() { setState('idle'); }, 1800);
      });
    });
  });
})();
</script>

<script>
(function() {
  // 只在文章页面显示目录
  var article = document.querySelector('.article-type-page, .article-type-post');
  if (!article) return;

  // 检查是否在文章详情页（非首页列表）
  if (document.querySelector('.article-more-link')) return;

  // 获取文章内容区域
  var content = article.querySelector('.article-entry');
  if (!content) return;

  // 获取所有标题
  var headings = content.querySelectorAll('h2, h3, h4');
  if (headings.length < 2) return;

  // 创建目录容器
  var toc = document.createElement('div');
  toc.className = 'article-toc-sidebar';
  toc.innerHTML = '<div class="toc-title">目录</div><div class="toc-content"><ul class="toc-list"></ul></div>';

  var tocList = toc.querySelector('.toc-list');

  headings.forEach(function(h, i) {
    if (!h.id) {
      h.id = 'heading-' + i;
    }

    var li = document.createElement('li');
    li.className = 'toc-item toc-' + h.tagName.toLowerCase();

    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.title = h.textContent;
    a.addEventListener('click', function(e) {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    li.appendChild(a);
    tocList.appendChild(li);
  });

  var sidebar = document.querySelector('#sidebar');
  if (!sidebar) return;
  sidebar.prepend(toc);

  // 滚动高亮
  var tocLinks = tocList.querySelectorAll('a');
  function updateActive() {
    var scrollPos = window.scrollY + 150;
    var activeIdx = 0;

    headings.forEach(function(h, i) {
      if (h.getBoundingClientRect().top + window.scrollY <= scrollPos) {
        activeIdx = i;
      }
    });

    tocLinks.forEach(function(link, i) {
      if (i === activeIdx) {
        link.parentElement.classList.add('active');
      } else {
        link.parentElement.classList.remove('active');
      }
    });
  }

  // 显示/隐藏逻辑
  function checkVisibility() {
    var articleRect = article.getBoundingClientRect();
    var scrollY = window.scrollY;

    // 当文章在视口内时显示目录
    if (scrollY > 200 && articleRect.bottom > 200) {
      toc.classList.add('visible');
    } else {
      toc.classList.remove('visible');
    }
  }

  window.addEventListener('scroll', function() {
    updateActive();
    checkVisibility();
  });

  updateActive();
  checkVisibility();
})();
</script>

<script>
(function() {
  var songs = [
    { name: 'gta4', file: '/music/gta4.mp3' },
    { name: 'try', file: '/music/try.mp3' },
    { name: '可爱', file: '/music/可爱.mp3' },
    { name: '打上火花', file: '/music/打上火花.mp3' },
    { name: '谢谢', file: '/music/谢谢.mp3' },
    { name: 'L_Youd _ Zerky - TempIe', file: '/music/L_Youd _ Zerky - TempIe (混音_Remix).ogg' },
    { name: 'Virtual Riot - Purple Dragons', file: '/music/Virtual Riot - Purple Dragons (Dragons VIP).ogg' },
    { name: 'All We Know (Virtual Riot Remix)', file: '/music/Virtual Riot _ The Chainsmokers _ Phoebe Ryan - All We Know (Virtual Riot Remix).ogg' },
    { name: '昼夜 - 千与千寻', file: '/music/昼夜 - 千与千寻 (钢琴版).ogg' },
    { name: 'lucky (氛围版)', file: '/music/等一会就睡 - 【FREE】lucky (氛围版).ogg' },
    { name: '鲜花', file: '/music/鲜花.mp4' }
  ];

  var audio = new Audio();
  var current = 0;
  var playing = false;
  var elPlay = document.getElementById('btn-play');
  var elTitle = document.getElementById('player-title');
  var elTime = document.getElementById('player-time');
  var elVolume = document.getElementById('player-volume');
  var elPlaylist = document.getElementById('player-playlist');
  var elBtnPlaylist = document.getElementById('btn-playlist');

  audio.volume = 0.02;

  function fmtTime(value) {
    if (!value || isNaN(value)) return '00:00';
    var minutes = Math.floor(value / 60);
    var seconds = Math.floor(value % 60);
    return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
  }

  function setPlayState(isPlaying) {
    playing = isPlaying;
    elPlay.innerHTML = '<span class="fa fa-' + (playing ? 'pause' : 'play') + '" aria-hidden="true"></span>';
    elPlay.setAttribute('aria-label', playing ? '暂停' : '播放');
    elPlay.setAttribute('title', playing ? '暂停' : '播放');
    elPlay.setAttribute('aria-pressed', String(playing));
  }

  function load(index) {
    current = index;
    audio.src = songs[index].file;
    elTitle.textContent = songs[index].name;
    renderPlaylist();
    if (playing) {
      audio.play().catch(function() { setPlayState(false); });
    }
  }

  function togglePlay() {
    if (!audio.src) load(0);
    if (audio.paused) {
      audio.play().then(function() { setPlayState(true); }).catch(function() { setPlayState(false); });
    } else {
      audio.pause();
      setPlayState(false);
    }
  }

  function next() { load((current + 1) % songs.length); }
  function previous() { load((current - 1 + songs.length) % songs.length); }

  function renderPlaylist() {
    elPlaylist.innerHTML = songs.map(function(song, index) {
      return '<div class="pl-item' + (index === current ? ' active' : '') + '" role="option" aria-selected="' + (index === current) + '" data-idx="' + index + '">' + song.name + '</div>';
    }).join('');
  }

  elPlay.addEventListener('click', togglePlay);
  document.getElementById('btn-prev').addEventListener('click', previous);
  document.getElementById('btn-next').addEventListener('click', next);

  elVolume.addEventListener('input', function() {
    audio.volume = this.value / 100;
  });

  elBtnPlaylist.addEventListener('click', function(event) {
    event.stopPropagation();
    var expanded = !elPlaylist.classList.contains('show');
    elPlaylist.classList.toggle('show', expanded);
    elBtnPlaylist.setAttribute('aria-expanded', String(expanded));
  });

  elPlaylist.addEventListener('click', function(event) {
    var item = event.target.closest('.pl-item');
    if (!item) return;
    load(parseInt(item.getAttribute('data-idx'), 10));
    audio.play().then(function() { setPlayState(true); }).catch(function() { setPlayState(false); });
  });

  document.addEventListener('click', function(event) {
    if (!elPlaylist.contains(event.target) && event.target !== elBtnPlaylist) {
      elPlaylist.classList.remove('show');
      elBtnPlaylist.setAttribute('aria-expanded', 'false');
    }
  });

  audio.addEventListener('timeupdate', function() {
    elTime.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration || 0);
  });
  audio.addEventListener('ended', function() { next(); });
  audio.addEventListener('pause', function() { setPlayState(false); });
  audio.addEventListener('play', function() { setPlayState(true); });
  audio.addEventListener('error', function() { setPlayState(false); });

  renderPlaylist();
})();
</script>
